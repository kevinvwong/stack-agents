name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  references:
    name: Agent + command reference linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint [AGENT:] and /cmd: references
        run: node scripts/lint-references.mjs

  prds:
    name: PRD structural linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/prds/*.md
        run: node scripts/lint-prds.mjs --root .

  dashboard:
    name: Dashboard — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync agent content
        run: npm run sync-agents

      - name: Lint
        run: npx eslint "src/**/*.{ts,tsx}"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build
