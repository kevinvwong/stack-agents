name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    name: Agent + command reference linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Lint [AGENT:] and /cmd: references"
        run: node scripts/lint-references.mjs

  prds:
    name: PRD structural linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/prds/*.md
        run: node scripts/lint-prds.mjs --root .

  dashboard:
    name: Dashboard — lint + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: ./node_modules/.bin/eslint "src/**/*.{ts,tsx}"

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        run: ./node_modules/.bin/vite build
