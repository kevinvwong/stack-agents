name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: read-all

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Extract changelog notes
        id: changelog
        run: |
          node -e "
          const fs = require('fs');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const tag = process.env.TAG.replace(/^v/, '');
          const re = new RegExp('## \\\\[' + tag.replace('.', '\\\\.').replace('.', '\\\\.') + '\\\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\\\[|$)');
          const match = text.match(re);
          const notes = match ? match[1].trim() : 'See CHANGELOG.md for details.';
          fs.writeFileSync('release-notes.md', notes);
          console.log('Extracted', notes.length, 'chars for', tag);
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
